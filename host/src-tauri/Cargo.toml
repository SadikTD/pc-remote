[package]
name = "pc-remote-host"
version = "1.0.0"
description = "PC Remote Host"
edition = "2021"
license = "GPL-3.0"

[lib]
name = "pc_remote_host"
path = "src/lib.rs"

[[bin]]
name = "pc-remote-host"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.4", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.5.4"
window-vibrancy = "0.8.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
