[package]
name = "pc-remote-host"
version = "2.0.0"
description = "PC Remote Host"
edition = "2021"
license = "GPL-3.0"

[lib]
name = "pc_remote_host"
path = "src/lib.rs"

[[bin]]
name = "pc-remote-host"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23.1"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "alloc"] }
igd-next = { version = "0.18.0", default-features = false, features = ["aio_tokio"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
percent-encoding = "2.3.2"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json"] }
opus = "0.4.0"
ring = "0.17.14"
rustls-platform-verifier = "0.7.1"
reed-solomon-erasure = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.4", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-notification = "2"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "net", "macros", "time", "sync"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
vigem-client = { version = "0.1.4", features = ["unstable_xtarget_notification"] }
window-vibrancy = "0.8.1"
windows = { version = "0.62", features = ["Foundation", "Media_Control", "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_Media_KernelStreaming", "Win32_Media_MediaFoundation", "Win32_Media_Multimedia", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_NetworkManagement_Dns", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Performance", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Power", "Win32_System_Registry", "Win32_System_Shutdown", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }

# FEC runs per frame: keep it fast in debug builds and tests too.
[profile.dev.package.reed-solomon-erasure]
opt-level = 3

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
tokio = { version = "1.53.3", features = ["test-util", "macros", "rt-multi-thread"] }
wiremock = "0.6.5"
