[package]
name = "pc-remote-host"
version = "1.0.0"
description = "PC Remote Host"
edition = "2021"
license = "GPL-3.0"

[lib]
name = "pc_remote_host"
path = "src/lib.rs"

[[bin]]
name = "pc-remote-host"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["ring"] }
ring = "0.17.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.4", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.5.4"
window-vibrancy = "0.8.1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
